<title>Answer Key Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap">
<!--
  Property Match Agent: the answer key check (D42), template.
  evals/harness/key_check.py fills the data placeholder. Each item is one
  disputed value: a listing link, a short quote, the key's value and the
  proposed one. Choices save to the page's store under reviews/<id>/; only the
  owner reads everyone's.
-->
<style>
/* Layout: one column of decisions, grouped by field, with a sticky progress bar. */
:root {
  --bg: #f3f4ef;
  --surface: #ffffff;
  --ink: #1d231f;
  --muted: #5b665e;
  --line: #d6dbd2;
  --accent: #1f6a58;
  --accent-soft: #e2efe9;
  --accent-ink: #ffffff;
  --ok: #2c7a4b;
  --warn: #a14b17;
  --warn-soft: #f7e6da;
  --font: "Commissioner", "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a17; --surface: #1f2420; --ink: #e8ece6; --muted: #a2ada4; --line: #333b35;
    --accent: #6cc3a8; --accent-soft: #23342d; --accent-ink: #0f241d; --ok: #74c793; --warn: #f0a070; --warn-soft: #3a2a20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a17; --surface: #1f2420; --ink: #e8ece6; --muted: #a2ada4; --line: #333b35;
  --accent: #6cc3a8; --accent-soft: #23342d; --accent-ink: #0f241d; --ok: #74c793; --warn: #f0a070; --warn-soft: #3a2a20;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 14px 12px; border-bottom: 1px solid var(--line);
}
.top h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top .sub { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
.spacer { flex: 1; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .track { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .fill { height: 100%; width: 0; background: var(--ok); }
.notice { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); border: 1px solid var(--warn); }
section { margin-top: 26px; display: grid; gap: 10px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.group-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.group-head .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.group-head .rule { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13.5px; }
.group-head button { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.item.done { border-color: var(--ok); }
.item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.num { font-weight: 600; font-variant-numeric: tabular-nums; }
.item-head a { color: var(--accent); font-weight: 500; text-decoration: none; }
.item-head a:hover { text-decoration: underline; }
.state { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.state.saved { color: var(--ok); }
.state.bad { color: var(--warn); }
blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--ink); font-size: 14.5px; overflow-wrap: anywhere; }
blockquote.none { color: var(--muted); font-style: italic; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice { position: relative; display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.choice input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
.choice .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.choice .value { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
.choice:has(input[type="radio"]:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input[type="radio"]:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice input[type="text"] { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; background: var(--bg); font-family: var(--mono); font-size: 13.5px; }
.note { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; background: var(--surface); font-size: 13.5px; }
.done-banner { margin-top: 26px; padding: 12px 16px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent); }
@media (max-width: 560px) {
  .top { position: static; }
  .choices { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Answer Key Check</h1>
      <p class="sub">Values where the answer key and the listing seem to disagree. Open the listing if you need to, then pick which is right. Each choice saves at once.</p>
    </div>
    <div class="spacer"></div>
    <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><span id="count"></span></div>
  </header>
  <div class="notice" id="notice" role="status" hidden></div>
  <main id="groups"></main>
  <div class="done-banner" id="done" hidden>All decided. Tell Claude you're done and it will build answer key v4 from your choices.</div>
</div>

<script type="application/json" id="data">__DATA_JSON__</script>
<script>
"use strict";
const PAYLOAD = JSON.parse(document.getElementById("data").textContent);
const ITEMS = PAYLOAD.items;
const saved = {};
let db = null, uid = null;
let meWrite = Promise.resolve();
const $ = id => document.getElementById(id);

function el(tag, attrs, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function notice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

function choiceCard(item, kind, label, valueText) {
  const id = "c-" + item.id + "-" + kind;
  const card = el("label", { class: "choice", for: id });
  const radio = el("input", { type: "radio", name: "c-" + item.id, id, value: kind });
  card.append(radio, el("span", { class: "label" }, label));
  if (kind === "other") {
    const input = el("input", { type: "text", id: "o-" + item.id, placeholder: "type the value", autocomplete: "off", "aria-label": "Other value" });
    input.addEventListener("focus", () => { radio.checked = true; });
    input.addEventListener("change", () => decide(item, "other"));
    card.append(input);
  } else {
    card.append(el("span", { class: "value" }, valueText));
  }
  radio.addEventListener("change", () => { if (kind !== "other" || $("o-" + item.id).value.trim()) decide(item, kind); else $("o-" + item.id).focus(); });
  return card;
}

function render() {
  const box = $("groups");
  box.replaceChildren();
  for (const group of PAYLOAD.groups) {
    const items = ITEMS.filter(i => i.group === group.field);
    if (!items.length) continue;
    const section = el("section", { "aria-labelledby": "h-" + group.field });
    const head = el("div", { class: "group-head" });
    head.append(el("h2", { id: "h-" + group.field }, group.title), el("span", { class: "count", id: "n-" + group.field }));
    if (group.field !== "metro_walk_min") {
      const all = el("button", { type: "button", id: "all-" + group.field }, "Use the proposed value for all " + items.length);
      all.addEventListener("click", async () => {
        for (const item of items) if (!saved[item.id]) { document.getElementById("c-" + item.id + "-proposed").checked = true; await decide(item, "proposed"); }
      });
      head.append(all);
    }
    head.append(el("p", { class: "rule" }, group.rule));
    section.append(head);
    for (const item of items) {
      const card = el("article", { class: "item", id: "i-" + item.id });
      const top = el("div", { class: "item-head" });
      top.append(el("span", { class: "num" }, "Listing " + item.number));
      const link = el("a", { href: item.url, target: "_blank", rel: "noopener noreferrer" }, "Open on Spitogatos ↗");
      top.append(link, el("span", { class: "state", id: "s-" + item.id }));
      card.append(top);
      card.append(item.quote ? el("blockquote", { lang: "el" }, item.quote) : el("blockquote", { class: "none" }, "The description gives no clear distance to the metro."));
      const choices = el("div", { class: "choices", role: "radiogroup", "aria-label": "Which is right for listing " + item.number });
      choices.append(choiceCard(item, "key", "The key is right", item.key_show), choiceCard(item, "proposed", "Proposed", item.proposed_show), choiceCard(item, "other", "Something else"));
      card.append(choices);
      const note = el("input", { type: "text", class: "note", id: "note-" + item.id, placeholder: "Note (optional)", autocomplete: "off", "aria-label": "Note" });
      note.addEventListener("change", () => { const rec = saved[item.id]; if (rec) decide(item, rec.choice); });
      card.append(note);
      section.append(card);
    }
    box.append(section);
  }
  refresh();
}

function refresh() {
  for (const item of ITEMS) {
    const rec = saved[item.id];
    const card = $("i-" + item.id), state = $("s-" + item.id);
    if (!card) continue;
    card.classList.toggle("done", !!rec);
    if (rec) {
      const radio = document.getElementById("c-" + item.id + "-" + rec.choice);
      if (radio && document.activeElement !== $("o-" + item.id)) radio.checked = true;
      if (rec.choice === "other" && document.activeElement !== $("o-" + item.id)) $("o-" + item.id).value = rec.other || "";
      if (document.activeElement !== $("note-" + item.id)) $("note-" + item.id).value = rec.note || "";
      state.textContent = "Saved"; state.className = "state saved";
    } else if (!state.classList.contains("bad")) { state.textContent = ""; state.className = "state"; }
  }
  for (const group of PAYLOAD.groups) {
    const items = ITEMS.filter(i => i.group === group.field);
    const n = $("n-" + group.field);
    if (n) n.textContent = items.filter(i => saved[i.id]).length + " of " + items.length + " decided";
  }
  const done = ITEMS.filter(i => saved[i.id]).length;
  $("count").textContent = done + " of " + ITEMS.length + " decided";
  $("fill").style.width = (100 * done / ITEMS.length) + "%";
  $("done").hidden = done < ITEMS.length;
}

async function decide(item, choice) {
  const state = $("s-" + item.id);
  if (!db || !uid) { state.textContent = "Can't save here: open the link signed in to Claude."; state.className = "state bad"; return; }
  const other = $("o-" + item.id).value.trim();
  if (choice === "other" && !other) { state.textContent = "Type the value first."; state.className = "state bad"; return; }
  const rec = {
    item: item.id, listing_id: item.listing_id, field: item.group, choice,
    other: choice === "other" ? other.slice(0, 80) : "", note: $("note-" + item.id).value.trim().slice(0, 300),
    key_value: item.key_value, proposed_value: item.proposed_value, decided_at: new Date().toISOString(),
  };
  state.textContent = "Saving…"; state.className = "state";
  try {
    await db.collection("reviews/" + uid + "/items").doc(item.id).set(rec);
  } catch (err) {
    state.textContent = err && err.code === "invalid_argument" ? "Your access can view but not save." : "Couldn't save. Try again.";
    state.className = "state bad";
    return;
  }
  saved[item.id] = rec;
  refresh();
  const body = { decided: ITEMS.filter(i => saved[i.id]).length, updated_at: new Date().toISOString() };
  meWrite = meWrite.then(() => db.doc("reviews/" + uid).set(body)).catch(() => {});
}

async function connect() {
  const claude = window.claude;
  const [dbNs, userNs] = claude && claude.use ? await Promise.all([claude.use("db"), claude.use("user")]) : [null, null];
  if (!dbNs || !userNs) { notice("Saving isn't available in this view. Open the link in Claude, signed in, to save your choices."); return; }
  const id = await userNs.id();
  if (!id) { notice("Sign in to Claude to save your choices."); return; }
  db = dbNs; uid = id;
  db.collection("reviews/" + uid + "/items").onSnapshot(snap => {
    for (const d of snap.docs) if (d.exists) saved[d.id] = d.data();
    refresh();
  }, () => notice("Your saved choices couldn't load. Reload the page."));
}

render();
connect();
</script>
