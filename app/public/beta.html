<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tispi</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600&display=swap">
<style>
  :root { color-scheme: light dark; --surface: light-dark(#f4f4f2, #151515); --ink: light-dark(#1b1b19, #ebebe7); --ink-muted: light-dark(#5b5b57, #a4a4a0); --dot: light-dark(#3f6d00, #c8f542); }
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font: 15px/22px "Commissioner", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; display: grid; gap: 16px; }
  .lockup { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .tile { fill: var(--ink); } .dot { fill: var(--dot); }
  p { margin: 0; } .muted { color: var(--ink-muted); }
</style>
</head>
<body>
<main>
  <div class="lockup"><svg width="40" height="24" viewBox="0 0 80 48" aria-hidden="true"><rect class="tile" x="2" y="30" width="12" height="12" rx="3"/><rect class="dot" x="17" y="6" width="12" height="12" rx="3"/><rect class="tile" x="32" y="30" width="12" height="12" rx="3"/><rect class="tile" x="47" y="30" width="12" height="12" rx="3"/><rect class="dot" x="62" y="6" width="12" height="12" rx="3"/></svg>Tispi</div>
  <p>This is a private beta. Open the invite link you were sent and the homes come up.</p>
  <p lang="el">Ιδιωτική δοκιμή. Άνοιξε τον σύνδεσμο πρόσκλησης που σου έστειλαν.</p>
  <p class="muted">Tispi. Finds your home. · tispi.ai</p>
</main>
</body>
</html>
